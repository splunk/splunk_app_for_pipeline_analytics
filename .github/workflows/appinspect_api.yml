name: App Inspect API

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  appinspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate and build the release package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          npm run lint
          npm test
          npm run package -- "$RELEASE_VERSION"
      - name: Validate the AppInspect API action and its committed bundle
        run: |
          npm ci --prefix .github/actions/appinspect_api
          npm run all --prefix .github/actions/appinspect_api
          git diff --exit-code -- .github/actions/appinspect_api/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package
          path: dist/splunk_app_for_pipeline_analytics.spl
          if-no-files-found: error
      - uses: ./.github/actions/appinspect_api
        with:
          filePath: dist/splunk_app_for_pipeline_analytics.spl
          splunkUser: ${{ secrets.SPLUNKBASE_USER }}
          splunkPassword: ${{ secrets.SPLUNKBASE_PASSWORD }}
          includedTags: cloud
      - name: Release the inspected package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/splunk_app_for_pipeline_analytics.spl \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
