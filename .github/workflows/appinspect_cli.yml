name: Lint and App Inspect CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate and package the app
        run: |
          npm run lint
          npm test
          npm run package -- 0.0.0
      - name: Validate the AppInspect API action and its committed bundle
        run: |
          npm ci --prefix .github/actions/appinspect_api
          npm run all --prefix .github/actions/appinspect_api
          git diff --exit-code -- .github/actions/appinspect_api/dist
      - name: Run AppInspect CLI
        run: |
          docker run --rm --entrypoint splunk-appinspect \
            -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
            ghcr.io/splunk/appinspect-cli-action/appinspect-cli-action:v2.18.0@sha256:484c64057debe2d5b6c45a5a0849ee28539d511bcd6e86d7846bce1399538c5e \
            inspect dist/splunk_app_for_pipeline_analytics.spl \
            --output-file appinspect_result.json --mode test --included-tags cloud --included-tags splunk_appinspect
          node scripts/check-appinspect.mjs appinspect_result.json
      - name: Upload package and inspection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-package-and-inspection
          path: |
            dist/splunk_app_for_pipeline_analytics.spl
            appinspect_result.json
          if-no-files-found: error
